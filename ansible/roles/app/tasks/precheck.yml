- name: Ensure Docker is installed 
  command: docker version 
  changed_when: false 

- name: Ensure Docker compose is installed 
  command: docker compose version 
  changed_when: false

- name: Ensure compose directory exists 
  file:
    path: "{{ base_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Ensure nginx directory exists 
  file:
    path: "{{ nginx_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Ensure nginx logs directory exists 
  file:
    path: "{{ nginx_log_dir }}"
    state: directory
    mode: '0777'
    recurse: yes

- name: Ensure absolute Laravel storage folder skeleton exists with 777 permissions
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    mode: '0777'
    recurse: yes
  loop:
    - storage
    - storage/logs
    - storage/framework
    # - storage/framework/sessions
    # - storage/framework/views
    # - storage/framework/cache
    - storage/app
    # - storage/app/public

- name: Ensure db  directory exists 
  file:
    path: "{{ database_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Ensure php-fpm  directory exists 
  file:
    path: "{{ fpm_dir }}"
    state: directory
    mode: '0755'
    recurse: yes

- name: Ensure third-party-service-simul  directory exists 
  file:
    path: "{{ third_party_service_simul }}"
    state: directory
    mode: '0755'
    recurse: yes

