  # Outbound mail.
  MAIL_HOST: ''
  MAIL_USERNAME: ''
  MAIL_FROM_ADDRESS: ''

  # Charging gateway endpoint.
  CGW_BASE_URL: ''

  # ML endpoint, retries, and feature flags.
  ML_BASE_URL: ''
