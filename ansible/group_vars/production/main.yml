---
# Deployment environment and inventory confirmation; secrets belong in vault.yml.
app_environment: production
app_production_inventory_confirmed: false

# Shared storage exported by the production NFS server.
app_storage_backend: nfs
app_nfs_server: 172.17.0.246
app_nfs_export_path: /srv/nfs/sena-storage-nfs
app_storage_volume_name: sena-production-storage

# Production overrides; common runtime settings live in the role defaults.
# Fill the endpoint settings and confirm the inventory before deployment.
app_environment_overrides:
  # Public application endpoint.
  APP_URL: https://mci.siplc.org

  # Sanctum stateful frontend domain.
  SANCTUM_STATEFUL_DOMAINS: mci.siplc.org

  # PostgreSQL endpoint.
  DB_HOST: 172.17.0.235

  # Outbound mail endpoint.
  MAIL_HOST: smtp.office365.com

  # Charging gateway endpoint.
  CGW_BASE_URL: http://sena-cgw_composition:8887/api/composition/sena/

  # ML endpoint.
  ML_BASE_URL: http://172.17.0.242:8000/

  # Production diagnostics; Pulse stays disabled as in env.production.
  LOG_LEVEL: info
  PULSE_ENABLED: 'false'
