---
# Deployment environment and inventory confirmation.
app_environment: staging

# Shared storage exported by the staging manager.
app_storage_backend: nfs
app_nfs_server: 172.17.0.206
app_nfs_export_path: /opt/core-api/core-api/storage
app_storage_volume_name: sena-staging-storage
app_pin_storage_to_manager: false

# Staging runtime settings; secrets come from Jenkins credentials.
app_environment_overrides:
  # Application identity and locale.
  APP_NAME: Laravel
  APP_URL: https://agrotech.digicontechnologies.com
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_FAKER_LOCALE: en_US
  APP_MAINTENANCE_DRIVER: file
  VITE_APP_NAME: Laravel

  # Password hashing.
  BCRYPT_ROUNDS: '12'

  # Application logging.
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_DEPRECATIONS_CHANNEL: 'null'
  LOG_LEVEL: debug

  # PostgreSQL connection and startup wait.
  DB_CONNECTION: pgsql
  DB_HOST: 172.17.0.190
  DB_PORT: '5432'
  DB_DATABASE: sena
  DB_USERNAME: sena

  # Session settings.
  SESSION_DRIVER: database
  SESSION_LIFETIME: '120'
  SESSION_ENCRYPT: 'false'
  SESSION_PATH: /
  SESSION_DOMAIN: 'null'

  # Storage, queues, and broadcasting.
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database

  # Cache backends.
  CACHE_STORE: database
  MEMCACHED_HOST: 127.0.0.1
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: '6379'

  # Outbound mail.
  MAIL_MAILER: smtp
  MAIL_HOST: smtp.office365.com
  MAIL_PORT: '587'
  MAIL_USERNAME: cattleinsurance@digicontechnologies.com
  MAIL_ENCRYPTION: tls
  MAIL_FROM_ADDRESS: cattleinsurance@digicontechnologies.com
  MAIL_FROM_NAME: Sena Microfinance

  # Optional object storage.
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: ''
  AWS_USE_PATH_STYLE_ENDPOINT: 'false'

  # Charging gateway endpoint.
  CGW_BASE_URL: http://sim-service:3000/

  # ML endpoint, retries, and feature flags.
  ML_BASE_URL: http://172.17.0.240:8000/
  ML_CONNECT_TIMEOUT: '10'
  ML_TIMEOUT: '60'
  ML_RETRY_ATTEMPTS: '1'
  ML_RETRY_DELAY: '100'
  ENABLE_ML_2PC: 'true'
  ENABLE_ML_AUDIT_LOGS: 'true'

  # Application feature flags.
  ENABLE_SAVE_MUZZLE_PHOTOS: 'true'
  ENABLE_CLAIM_VET_REVIEW: 'false'

  # Pulse monitoring and retention.
  PULSE_ENABLED: 'true'
  PULSE_PATH: api/pulse
  PULSE_STORAGE_KEEP: 24 hours
  PULSE_INGEST_KEEP: 24 hours
  PULSE_SLOW_JOBS_THRESHOLD: '500'
  PULSE_SLOW_OUTGOING_REQUESTS_THRESHOLD: '500'
  PULSE_SLOW_QUERIES_THRESHOLD: '100'
  PULSE_SLOW_REQUESTS_THRESHOLD: '500'

  # Log viewer and request tracing.
  LOG_VIEWER_ENABLED: 'true'
  LOG_VIEWER_PATH: api/logs
  ENABLE_API_REQUEST_LOGGING: 'true'
