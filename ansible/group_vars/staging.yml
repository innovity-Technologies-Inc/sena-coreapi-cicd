---
# Deployment environment.
app_environment: staging

# Shared storage exported by the staging manager; tasks can use either NFS client.
app_storage_backend: nfs
app_nfs_server: 172.17.0.206
app_nfs_export_path: /opt/core-api/core-api/storage
app_storage_volume_name: sena-staging-storage

# Staging overrides; common runtime settings live in the role defaults.
app_environment_overrides:
  # Public application endpoint.
  APP_URL: https://agrotech.digicontechnologies.com

  # Sanctum stateful frontend domain.
  SANCTUM_STATEFUL_DOMAINS: agrotech.digicontechnologies.com

  # PostgreSQL endpoint.
  DB_HOST: 172.17.0.190

  # Outbound mail endpoint.
  MAIL_HOST: smtp.office365.com

  # Charging gateway endpoint.
  CGW_BASE_URL: http://sim-service:3000/

  # ML endpoint.
  ML_BASE_URL: http://172.17.0.240:8000/

  # Staging diagnostics retain debug logging with Pulse disabled.
  LOG_LEVEL: debug
  PULSE_ENABLED: 'false'
